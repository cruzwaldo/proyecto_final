<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecomunicaciones</title>
    <link rel="stylesheet" href="./../css/general.css">
    <link rel="stylesheet" href="./../css/contacto.css">
</head>

<body style="
        background-image: url('https://img.magnific.com/fotos-premium/mast-telecomunicaciones-antenas-television-tecnologia-inalambrica_54109-365.jpg');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;">

    <header>

        <span><img class="logo"
                src="https://png.pngtree.com/png-clipart/20230918/original/pngtree-telecommunication-chalk-concept-icon-board-antenna-doodle-vector-png-image_12351529.png"
                alt=""></span>
        <nav class="menu"></nav>
        <ul class="menu_list">

            <li>
                <a href="./../index.html" class="menu_link">Inicio</a>
            </li>

            <li>
                <a href="./servicios.html" class="menu_link">Servicios</a>
            </li>
            <li>
                <a href="./contacto.html" class="menu_link">Contacto</a>
            </li>
        </ul>
        </nav>
    </header>


    <main>

        <section class="contacto">

            <h1>Contáctanos</h1>

            <p class="descripcion">
                ¿Tienes alguna pregunta o necesitas información sobre
                nuestros servicios? Déjanos tus datos y nos pondremos
                en contacto contigo.
            </p>


            <form class="formulario_contacto" action="#" method="post">

                <div class="campo">

                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>

                </div>

                <div class="campo">

                    <label for="correo"> Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                </div>


                <div class="campo">

                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="3128954367"></div>

                
                <div class="campo">

                    <label for="servicio">Servicio de interés</label>
                    <select id="servicio" name="servicio" required>

                        <option value="">Selecciona un servicio</option>
                        <option value="obra-civil">Obra Civil</option>
                        <option value="telecomunicaciones">Telecomunicaciones</option>
                        <option value="electricidad">Electricidad</option>
                        <option value="otro">Otro</option>

                    </select>

                </div>


                <div class="campo">

                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Escribe el asunto" required>

                </div>
 
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje..." required></textarea>

                </div>
               
                <button type="submit">Enviar mensaje</button>

            </form>

        </section>

    </main>
    <footer>

        <div class="redes1">

            <div>
                <a target="_blank" rel="" href="https://www.facebook.com/?locale=es_LA">
                    <img class="redes" src="./../imagenes/facebook 2.png" alt="Facebook">
                </a>
            </div>


            <div>
                <a target="_blank" rel="" href="https://www.instagram.com/">
                    <img class="redes" src="./../imagenes/instagram  2.png" alt="Instagram">
                </a>
            </div>


            <div>
                <a target="_blank" rel="noopener noreferrer" href="https://x.com/iniciarsesion?lang=es">
                    <img class="redes" src="./../imagenes/twitter 2.png" alt="X / Twitter">
                </a>
            </div>

        </div>


        <p class="derechos_autor">
            Todos los derechos de autor reservados - 2026
        </p>

    </footer>


</body>

</html>
